model_id: "Qwen/Qwen3-VL-8B-Instruct"
attn_implementation: "sdpa"  # shared by inference and fine-tuning

inference:
    max_new_tokens: 64

sft:
    output_dir: "output/qwen3-vl-lora"
    num_train_epochs: 3
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    warmup_ratio: 0.03
    lr_scheduler_type: "cosine"
    logging_steps: 10
    save_strategy: "epoch"
    bf16: true
    remove_unused_columns: false

lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]  # LLM decoder only
    task_type: "CAUSAL_LM"
